<style>
.vb-l7k,
.vb-l7k * { box-sizing: border-box; }
.vb-l7k * { margin: 0; padding: 0; }
.vb-l7k { font-family: var(--t-text-font); color: #14181f; background: #f5f7fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 20px; -webkit-text-size-adjust: 100%; }
.vb-l7k__wrap { width: 100%; max-width: 420px; text-align: center; }
.vb-l7k__photo { display: block; width: 100%; max-width: 260px; height: auto; aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 30%; border-radius: 24px; margin: 0 auto 24px; }
.vb-l7k__title { font-family: var(--t-headline-font); font-size: clamp(26px, 7vw, 34px); line-height: 1.15; font-weight: 800; letter-spacing: -.015em; text-wrap: balance; }
.vb-l7k__text { font-size: 18px; line-height: 1.45; color: #3d4654; margin: 14px 0 26px; text-wrap: balance; }
.vb-l7k__btns { display: grid; gap: 12px; }
.vb-l7k__btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; border-radius: 16px; font-size: 18px; font-weight: 700; color: #fff; text-decoration: none; transition: transform .15s cubic-bezier(.25,1,.5,1), opacity .15s; }
.vb-l7k__btn:hover { opacity: .92; }
.vb-l7k__btn:active { transform: scale(.98); }
.vb-l7k__btn svg { width: 24px; height: 24px; fill: #fff; flex: none; }
.vb-l7k__wa { background: #168a45; }
.vb-l7k__tg { background: #1e7fbf; }
@media (prefers-reduced-motion: reduce) { .vb-l7k__btn { transition: none; } }
</style>
<script>
(function () {
  var root = document.getElementById('vb-l7k-main');
  if (!root) return;
  var DL = {
    waPhone: "WA_PHONE",   // номер WhatsApp без + и пробелов, например 77001234567
    tgUser: "TG_USERNAME", // username Telegram без @
    waText: "Здравствуйте! Хочу оставить заявку на подготовку к IELTS (с сайта)",
    tgStart: "site"        // параметр для бота: t.me/бот?start=site
  };
  var wa = "https://wa.me/" + DL.waPhone + "?text=" + encodeURIComponent(DL.waText);
  var tg = "https://t.me/" + DL.tgUser + (DL.tgStart ? "?start=" + encodeURIComponent(DL.tgStart) : "");
  root.querySelectorAll('[data-cta]').forEach(function (a) {
    var ch = a.getAttribute('data-cta');
    a.href = ch === 'whatsapp' ? wa : tg;
    a.target = '_blank';
    a.rel = 'noopener';
    a.addEventListener('click', function () {
      // ХУК ДЛЯ МЕТЫ: сюда вставим событие (Contact / Lead), когда будут скрипты
    });
  });
})();
</script>
